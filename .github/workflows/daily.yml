name: daily-forecast

on:
  schedule:
    # Gate closure is 12:00 Swedish time = 10:00 UTC (summer) / 11:00 UTC (winter).
    # GitHub often starts scheduled jobs hours late, so there are three triggers.
    # The first run publishes; later ones log "exists" and only refresh the scores.
    - cron: "37 4 * * *"
    - cron: "7 6 * * *"
    - cron: "37 7 * * *"
  workflow_dispatch: {}   # "Run workflow" button for manual runs

permissions:
  contents: write         # needed to commit the results back

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Data pulls may fail (APIs go down). The forecast step decides what to do
      # with whatever data is available and logs it, so these never stop the job.
      - name: Fetch load (ENTSO-E)
        continue-on-error: true
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python src/fetch.py --update

      - name: Fetch observed temperature (SMHI)
        continue-on-error: true
        run: python src/fetch_weather.py

      - name: Forecast tomorrow
        run: python src/forecast.py

      - name: Score past forecasts
        run: python src/score.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts scores data docs
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
